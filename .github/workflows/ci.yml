name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  test-infra:
    name: Test — infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm test

  test-web:
    name: Test — web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: test-infra
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # cdk.context.json is not committed, so synth resolves HostedZone.fromLookup
      # live — which needs AWS credentials.
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-blog-pipeline-github-ci-sandbox
          aws-region: eu-west-2
      - run: npm run ci-synth-sandbox

  version:
    name: Compute version
    runs-on: ubuntu-latest
    needs: test-infra
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-blog-pipeline-github-ci-sandbox
          aws-region: eu-west-2
      # Compute the version once; both environments deploy this same value so a
      # release never changes version between sandbox and prod.
      - name: Compute version
        id: compute
        run: echo "version=$(scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Upload version.json
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: infra/version.json

  deploy-sandbox:
    name: Deploy — sandbox
    runs-on: ubuntu-latest
    needs: [synth, test-web, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: sandbox
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Deploy the version computed once up front, so sandbox and prod match.
      - name: Download computed version
        uses: actions/download-artifact@v4
        with:
          name: version
          path: infra
      - name: Configure AWS credentials (sandbox)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050268859:role/nakomis-blog-pipeline-github-ci-sandbox
          aws-region: eu-west-2
      - name: Deploy to sandbox
        run: npm run ci-deploy-sandbox
      # cdk deploy creates the bucket and distribution but does not fill them —
      # build the SPA, sync it to S3 and invalidate the CloudFront cache.
      - name: Publish the dashboard SPA
        working-directory: web
        run: |
          npm ci
          scripts/set-config.sh sandbox
          npm run build
          BUCKET=$(aws ssm get-parameter --name /blog-pipeline/sandbox/web/bucket-name --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter --name /blog-pipeline/sandbox/web/distribution-id --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'
      - name: Record deployment
        run: scripts/record-deployment.sh sandbox

  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: deploy-sandbox
    if: github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # The same version artifact the sandbox deploy used — never recomputed.
      - name: Download computed version
        uses: actions/download-artifact@v4
        with:
          name: version
          path: infra
      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/nakomis-blog-pipeline-github-ci-prod
          aws-region: eu-west-2
      - name: Deploy to production
        run: npm run ci-deploy-prod
      # cdk deploy creates the bucket and distribution but does not fill them —
      # build the SPA, sync it to S3 and invalidate the CloudFront cache.
      - name: Publish the dashboard SPA
        working-directory: web
        run: |
          npm ci
          scripts/set-config.sh prod
          npm run build
          BUCKET=$(aws ssm get-parameter --name /blog-pipeline/prod/web/bucket-name --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter --name /blog-pipeline/prod/web/distribution-id --query Parameter.Value --output text)
          aws s3 sync dist/ "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'
      - name: Record deployment
        run: scripts/record-deployment.sh prod
